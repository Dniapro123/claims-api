services:
  postgres:
    image: postgres:16
    container_name: claims-api-postgres
    environment:
      POSTGRES_DB: claims_db
      POSTGRES_USER: claims_user
      POSTGRES_PASSWORD: claims_password
    ports:
      - "5433:5432"
    volumes:
      - claims_postgres_data_v3:/var/lib/postgresql/data

volumes:
  claims_postgres_data_v3: